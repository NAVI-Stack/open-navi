oss27_version: "1.0"
skill_id: "self-diagnostic"
semver: "0.1.0"
display:
  name: "Self Diagnostic"
  description: >
    Inspect recent NAVI runtime failures from the structured error log and summarize the most common failure modes.
  emoji: "D"
interfaces:
  - name: "recent_errors"
    description: "List recent runtime errors. Use this to answer what failed recently or why a chat/runtime failed."
    transport:
      type: "internal"
    input_schema:
      type: "object"
      properties:
        severity:
          type: "string"
        component:
          type: "string"
        chat_id:
          type: "string"
        error_type:
          type: "string"
        limit:
          type: "integer"
      additionalProperties: false
    output_schema:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            type: "object"
  - name: "error_summary"
    description: "Summarize recent errors grouped by component and type."
    transport:
      type: "internal"
    input_schema:
      type: "object"
      properties:
        window:
          type: "string"
          description: "Duration like 24h or 168h."
      additionalProperties: false
    output_schema:
      type: "object"
      properties:
        window:
          type: "string"
        items:
          type: "array"
          items:
            type: "object"
effects:
  side_effects: []
  risk_tier: "low"
  requires_confirmation: false
security:
  auth: []
  data_access:
    pii: "none"
    secrets: "forbidden"
  sandbox:
    required: false
    network_egress: []
performance:
  expected_p50_ms: 100
  timeout_ms: 1000
observability:
  log_redaction: []
  emit_metrics: []
governance:
  publisher: "navi.official"
  signed: false
  trust_tier: "builtin"
capability:
  tags: ["diagnostics", "errors", "runtime"]
  domains: ["memory", "operations"]
  provides: ["diagnostics.error_log.read"]
  command_type: "query"
