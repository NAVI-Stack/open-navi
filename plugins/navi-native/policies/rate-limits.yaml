plugin_id: navi.native

limits:
  file_read:
    qps: 10
    burst: 20
    retry_policy: safe
  file_write:
    qps: 2
    burst: 5
    retry_policy: conditional
    idempotency_key_required_for_retry: true
  list_dir:
    qps: 10
    burst: 20
    retry_policy: safe
  folder_pick:
    qps: 1
    burst: 1
    retry_policy: safe

circuit_breaker:
  failure_threshold: 5
  window_seconds: 60
  cooldown_seconds: 300
