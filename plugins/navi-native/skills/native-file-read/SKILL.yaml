oss27_version: 1.0
skill_id: navi.native.file_read
semver: 0.1.0

display:
  name: Read Native File
  description: Read a file from the host filesystem via the PET desktop bridge.
  emoji: "📄"

interfaces:
  - name: read
    description: Read a UTF-8 text file from the host filesystem using an absolute path relayed through the PET bridge.
    transport:
      type: bridge
      connector: navi.connector.pet_bridge
      operation: file_read
    input_schema:
      type: object
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string
          description: Absolute path to the file on the host filesystem.
    output_schema:
      type: object
      additionalProperties: false
      required:
        - content
        - bytes_read
      properties:
        content:
          type: string
          description: UTF-8 text content of the file.
        bytes_read:
          type: integer
          description: Number of bytes read.
        truncated:
          type: boolean
          description: True if the file was larger than the read limit and content was truncated.

effects:
  side_effects:
    - reads_external_system
  risk_tier: medium
  requires_confirmation: false
  idempotency_level: idempotent
  reversibility: reversible_internal

security:
  auth:
    type: bridge_token
    env:
      - NAVI_PET_BRIDGE_TOKEN
  data_access:
    pii: possible
    secrets: forbidden
  sandbox:
    required: true
    network_egress: none

performance:
  timeout_ms: 5000
  rate_limit:
    qps: 10
    burst: 20

governance:
  publisher: navi.builtin
  signed: false
  trust_tier: builtin

capability:
  tags:
    - filesystem
    - read
    - native
  domains:
    - workspace
  provides:
    - native.file_read
  requires:
    - navi.connector.pet_bridge

reliability:
  expected_failure_modes:
    - permission_denied
    - file_not_found
    - bridge_unavailable
    - path_outside_workspace
  retry_policy: safe
