services:
  navid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: navid
    ports:
      - "6284:6284"
    volumes:
      - ${NAVI_DATA_DIR:-${NAVI_DATA_DRIVE:-./.navi}/data}:/navi/data
      - ${NAVI_CONFIG_DIR:-${NAVI_DATA_DRIVE:-./.navi}/config}:/navi/config
      - ${NAVI_SKILLS_DIR:-${NAVI_DATA_DRIVE:-./.navi}/skills}:/navi/skills
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      NAVI_SQLITE_PATH: /navi/data/navi.db
      NAVI_WORKSPACE_DIR: /navi/data/workspace
      NAVI_OLLAMA_URL: http://host.docker.internal:11434/v1
      NAVI_LLM_CALL_TIMEOUT: 5m
      NAVI_GATEWAY_SHARED_SECRET: "navi-secret-stable"
      NAVI_SANDBOX_CONTAINER_NAME: navid
      NAVI_DEBUG: "true"
      TZ: ${TZ:-UTC}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6284/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


